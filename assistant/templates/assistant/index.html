{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lala">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lala - Study Helper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" rel="stylesheet">
  <link rel="manifest" href="{% static 'assistant/manifest.json' %}">
  <meta name="theme-color" content="#0d0c1f">
  <link rel="apple-touch-icon" href="{% static 'assistant/icons/icon-192.png' %}">
  <style>
    
    :root {
      --bg: #0d0c1f;
      --accent: #7fd6d6;
      --purple: #8b5cf6;
      --pink: #c084fc;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: #dcdcec;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(139, 92, 246, .22), transparent 50%),
        radial-gradient(ellipse at 85% 30%, rgba(127, 214, 214, .09), transparent 45%),
        radial-gradient(ellipse at 40% 95%, rgba(192, 132, 252, .13), transparent 50%),
        var(--bg);
      background-attachment: fixed;
    }
        .message.md { white-space: normal; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .message.md img { max-width: 100%; height: auto; }
    .message.md pre { max-width: 100%; }
    .message.md > :first-child { margin-top: 0; }
    .message.md > :last-child { margin-bottom: 0; }
    .message.md p { margin: 0 0 .7em; }
    .message.md h1, .message.md h2, .message.md h3, .message.md h4 {
      font-size: 1.05rem; font-weight: 700; margin: .9em 0 .4em; color: var(--accent);
    }
    .message.md h1 { font-size: 1.2rem; }
    .message.md ul, .message.md ol { padding-left: 1.3em; margin: 0 0 .7em; }
    .message.md li { margin-bottom: .25em; }
    .message.md strong { color: #ecebf7; }
    .message.md a { color: var(--accent); }
    .message.md code {
      background: rgba(255,255,255,.12); padding: 1px 6px;
      border-radius: 6px; font-size: .88em;
    }
    .message.md pre {
      background: rgba(0,0,0,.4); padding: 10px 12px;
      border-radius: 10px; overflow-x: auto;
    }
    .message.md pre code { background: none; padding: 0; }
    .message.md blockquote {
      border-left: 3px solid var(--accent); margin: 0 0 .7em;
      padding-left: 12px; color: #c8c8e6;
    }
    .message.md table { border-collapse: collapse; margin-bottom: .7em; display: block; overflow-x: auto; }
    .message.md th, .message.md td { border: 1px solid var(--glass-border); padding: 4px 8px; }
    .message.md hr { border-color: var(--glass-border); }
    .message.md .katex-display { overflow-x: auto; overflow-y: hidden; }

    #install-btn {
      background: linear-gradient(90deg, var(--pink), var(--accent));
      color: #0b0b1e; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: .8rem; font-weight: 600;
    }
  button { touch-action: manipulation; }
    .footer-note { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }

    .app {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 1.6rem; font-weight: 700; line-height: 1.2;
    }
    .brand .logo { width: 34px; height: 34px; flex: none; }
    .wordmark {
      letter-spacing: .5px;
      background: linear-gradient(90deg, #7fd6d6, #c4a8ee);
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: .8rem;
      color: #9a9ac0;
    }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: .75rem; color: #bdbde0;
      background: var(--glass); border: 1px solid var(--glass-border);
      padding: 6px 12px; border-radius: 20px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%;
           background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    /* Chat */
    #chat { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 16px 16px; display: flex; flex-direction: column; }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
    .row { align-self: flex-start; max-width: 86%; min-width: 0; flex: none; margin-bottom: 14px; }
    .row.user { align-self: flex-end; }
    .name { font-size: .75rem; font-weight: 600; color: #9a9ac0; margin: 0 8px 4px; }
    .row.ai .name { color: var(--accent); }
    .row.user .name { text-align: right; }
    .message {
      padding: 12px 16px; border-radius: 18px;
      white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; font-size: 1rem;
    }
    .message.ai {
      background: rgba(20, 17, 46, .72);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top-left-radius: 4px;
    }
    .message.user {
      color: #0b0b1e; font-weight: 500;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      border-top-right-radius: 4px;
      box-shadow: 0 2px 10px rgba(127, 214, 214, .10);
    }



    /* Greeting hero: spinning planet */
    .empty { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 16px; }
    .planet { width: min(300px, 88vw); height: auto; overflow: visible; animation: bob 6s ease-in-out infinite; }
    .planet .spin { animation: spin 3.2s linear infinite; }
    .planet .spin2 { animation: spin2 1.9s linear infinite; }
    .planet .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes spin { to { transform: translateX(-44px); } }
    @keyframes spin2 { to { transform: translateX(-30px); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .hero-title { margin: 6px 0 4px; font-size: 1.45rem; font-weight: 600; color: #e6e6f2; }
    .hero-sub { margin: 0; font-size: 1rem; color: #9a9ac0; }
    @media (prefers-reduced-motion: reduce) { .planet, .planet .spin, .planet .spin2, .planet .star { animation: none; } }

    /* Thinking: spinning logo */
    .think { display: block; width: 34px; height: 34px; animation: think-spin 1.4s linear infinite; }
    @keyframes think-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .think { animation: none; } }

    /* Menu + history drawer */
    .head-left { display: flex; align-items: center; gap: 12px; }
    #menu-btn, #close-drawer {
      width: 40px; height: 40px; flex: none; display: grid; place-items: center;
      border-radius: 12px; background: var(--glass); color: var(--accent);
      border: 1px solid var(--glass-border);
    }
    #menu-btn svg, #close-drawer svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    #overlay {
      position: fixed; inset: 0; z-index: 19; background: rgba(5, 4, 15, .6);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #overlay.open { opacity: 1; pointer-events: auto; }
    #drawer {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
      width: min(300px, 85vw); background: #15122f;
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-102%); visibility: hidden;
      transition: transform .2s, visibility .2s;
    }
    #drawer.open { transform: none; visibility: visible; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .drawer-head strong { font-size: 1.1rem; color: var(--accent); }
    #new-chat {
      border: none; border-radius: 14px; padding: 10px 14px; font-weight: 600; text-align: left;
      color: #0b0b1e; background: linear-gradient(90deg, var(--pink), var(--accent));
    }
    .hist-label { margin: 18px 4px 8px; font-size: .75rem; color: #9a9ac0; }
    #history { flex: 1; overflow-y: auto; }
    .hist-empty { padding: 8px 4px; font-size: .85rem; color: #7c7ca0; }
    .hist-item { display: flex; align-items: center; margin-bottom: 6px; border: 1px solid transparent; border-radius: 12px; }
    .hist-item:hover { background: var(--glass); }
    .hist-item.active { background: var(--glass); border-color: var(--glass-border); }
    .hist-open {
      flex: 1; min-width: 0; padding: 10px 12px; text-align: left; background: none; border: 0;
      color: #dcdcec; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hist-del { width: 34px; height: 34px; flex: none; background: none; border: 0; color: #9a9ac0; font-size: 1.1rem; }
    .hist-del:hover { color: #ff9ecb; }
    @media (prefers-reduced-motion: reduce) { #drawer, #overlay { transition: none; } }

    /* Chips */
    .chips { padding: 0 16px 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      background: var(--glass); border: 1px solid var(--glass-border);
      color: var(--accent); border-radius: 20px;
      padding: 6px 14px; font-size: .8rem;
    }
    .chip:hover { background: var(--accent); color: #0b0b1e; }

    /* Composer */
    .composer {
      margin: 0 12px 6px; padding: 12px;
      background: rgba(15, 12, 40, .55); border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
    }
    #prompt {
      background: rgba(0, 0, 0, .25); color: #e6e6f2;
      border: 1px solid var(--glass-border); border-radius: 14px; resize: none;
    }
    #prompt::placeholder { color: #8c8cb0; }
    #prompt:focus {
      background: rgba(0, 0, 0, .35); color: #e6e6f2;
      border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(127, 214, 214, .2);
    }
    #send-btn {
      border: none; border-radius: 22px; padding: 8px 30px; font-weight: 600;
      color: #0b0b1e; background: linear-gradient(90deg, var(--pink), var(--accent));
      box-shadow: 0 2px 10px rgba(192, 132, 252, .18);
    }
    #send-btn:hover { filter: brightness(1.1); }
    #new-btn {
      background: transparent; color: #bdbde0; border-radius: 22px;
      border: 1px solid var(--glass-border); padding: 8px 22px;
    }
    #new-btn:hover { color: #fff; border-color: #fff; }

    .footer-note { font-size: .7rem; color: #7c7ca0; text-align: center; padding: 4px 0 10px; }

    #offline-banner {
      background: rgba(255, 193, 7, .15); color: #ffd666;
      border: none; border-bottom: 1px solid rgba(255, 193, 7, .4);
      border-radius: 0; text-align: center; padding: 8px; margin: 0; font-size: .85rem;
    }


    /* Fallback: bubbles placed directly in #chat (older app.js) */
    #chat > .message { width: fit-content; max-width: 86%; flex: none; margin-bottom: 12px; }
    #chat > .message.user { align-self: flex-end; }
    #chat > .message.ai { align-self: flex-start; }
    @media (max-width: 600px) { #chat > .message { max-width: 94%; } #chat > .message.ai { max-width: 100%; } }

    /* Mobile chat bubbles */
    @media (max-width: 600px) {
      #chat { padding: 6px 10px 12px; }
      .row { max-width: 94%; margin-bottom: 12px; }
      .row.ai { max-width: 100%; }
      .name { margin: 0 6px 3px; }
      .message { padding: 10px 13px; font-size: .95rem; line-height: 1.55; border-radius: 16px; }
      .message.ai { border-top-left-radius: 4px; background: rgba(20, 17, 46, .9);
                    backdrop-filter: none; -webkit-backdrop-filter: none; }
      .message.user { border-top-right-radius: 4px; }
      .message.md h1 { font-size: 1.1rem; }
      .message.md h2, .message.md h3, .message.md h4 { font-size: 1rem; }
      .message.md pre { font-size: .8rem; padding: 8px 10px; }
      .message.md table { font-size: .85rem; max-width: 100%; }
      .message.md .katex-display { margin: .6em 0; max-width: 100%; }
      .message.md .katex { font-size: 1em; }
      #prompt { font-size: 16px; } /* stops iOS zooming when the box is tapped */
    }

    /* ===== Fit every phone ===== */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
    .app { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .app-header { gap: 8px; padding-top: calc(16px + env(safe-area-inset-top)); }
    .head-left { min-width: 0; }
    .status { flex: none; white-space: nowrap; }
    .chip, #send-btn, #new-btn { white-space: nowrap; }
    img, svg { max-width: 100%; }

    /* Small phones (iPhone SE, older Androids) */
    @media (max-width: 400px) {
      .app-header { padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
      .head-left { gap: 8px; }
      #menu-btn { width: 36px; height: 36px; }
      .brand { font-size: 1.35rem; }
      .brand .logo { width: 28px; height: 28px; }
      .tagline { font-size: .72rem; }
      .status { font-size: .7rem; padding: 5px 10px; }
      .chips { padding: 0 10px 8px; gap: 6px; }
      .chip { font-size: .75rem; padding: 5px 11px; }
      .composer { margin: 0 8px 4px; padding: 10px; }
      #send-btn { padding: 8px 24px; }
      #new-btn { padding: 8px 16px; }
      .hero-title { font-size: 1.25rem; }
      .hero-sub { font-size: .9rem; }
    }

    /* Very narrow screens: drop the status pill so the header never overflows */
    @media (max-width: 350px) { .status { display: none; } }

    /* Short screens (landscape, or keyboard open) */
    @media (max-height: 560px) {
      .app-header { padding-top: calc(6px + env(safe-area-inset-top)); padding-bottom: 6px; }
      .planet { width: min(150px, 40vw); }
      .hero-title { font-size: 1.1rem; margin: 2px 0; }
      .hero-sub { font-size: .85rem; }
      .chips { padding-bottom: 6px; }
      .footer-note { display: none; }
    }

    /* ===== Only the conversation scrolls ===== */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100vh; height: 100dvh; min-height: 0; }
    .app { height: 100%; overflow: hidden; }
    .app-header, .chips, .composer, .footer-note, #offline-banner { flex: none; }
    #chat { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
            overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

    /* ===== Bubble alignment fix: rows span the chat, bubbles sit inside them ===== */
    .app > #chat {
      box-sizing: border-box; width: 100%;
      padding: 8px 14px 14px;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
    }
    #chat > .row, #chat > .row.ai, #chat > .row.user {
      align-self: stretch; width: 100%; max-width: 100%; min-width: 0; flex: none;
      display: flex; flex-direction: column; align-items: flex-start;
    }
    #chat > .row.user { align-items: flex-end; }
    #chat > .row .message { width: fit-content; max-width: 88%; min-width: 0; }
    #chat > .row.ai .message { max-width: 100%; }
    #chat > .row .name { margin: 0 6px 3px; }
  </style>
</head>
<body>
  {% csrf_token %}

  <div class="app">
    <div id="offline-banner" class="d-none">
      You are offline. Lala needs internet to answer.
    </div>

    <header class="app-header">
      <div class="head-left">
        <button id="menu-btn" aria-label="Open menu" aria-controls="drawer">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <div class="brand"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ec8f2"/><stop offset="1" stop-color="#8ea3fa"/></linearGradient></defs><g transform="rotate(-20 50 50)"><path d="M8 50A42 13 0 0 1 92 50" fill="none" stroke="#ffe08a" stroke-width="4" stroke-linecap="round" opacity=".7"/><circle cx="50" cy="50" r="22" fill="url(#lg)"/><path d="M8 50A42 13 0 0 0 92 50" fill="none" stroke="#ffe08a" stroke-width="4" stroke-linecap="round"/></g></svg><span class="wordmark">Lala</span></div>
          <div class="tagline">Study assistant</div>
        </div>
      </div>
      <div class="status"><span class="dot"></span> Class assistant</div>
    </header>

    <div id="chat"></div>

    <div class="chips">
      <button class="chip">Give me an example</button>
      <button class="chip">Explain in simple terms</button>
      <button class="chip">Quiz me</button>
      <button id="install-btn" class="d-none">Install app</button>
    </div>

    <div class="composer">
      <textarea id="prompt" class="form-control mb-2" rows="2"
                placeholder="Ask Lala a question..."></textarea>
      <div class="d-flex justify-content-between">
        <button id="new-btn">New chat</button>
        <button id="send-btn">Send</button>
      </div>
    </div>

    <div class="footer-note">Safe Student Mode • Offline PWA</div>
  </div>
  <div id="overlay"></div>
  <aside id="drawer" aria-label="Chat history">
    <div class="drawer-head">
      <strong>Lala</strong>
      <button id="close-drawer" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <button id="new-chat">+ New chat</button>
    <div class="hist-label">History</div>
    <div id="history"></div>
  </aside>

  <template id="think-tpl">
    <svg class="think" viewBox="0 0 100 100" role="img" aria-label="Lala is thinking">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5ec8f2"/>
          <stop offset="1" stop-color="#8ea3fa"/>
        </linearGradient>
      </defs>
      <g transform="rotate(-20 50 50)">
        <path d="M8 50A42 13 0 0 1 92 50" fill="none" stroke="#ffe08a" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
        <circle cx="50" cy="50" r="22" fill="url(#tg)"/>
        <path d="M8 50A42 13 0 0 0 92 50" fill="none" stroke="#ffe08a" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </svg>
  </template>

  <template id="hero-tpl">
    <div class="empty">
      <svg class="planet" viewBox="0 0 280 220" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5ec8f2"/>
            <stop offset="1" stop-color="#8ea3fa"/>
          </linearGradient>
          <radialGradient id="shade" cx=".32" cy=".28" r=".9">
            <stop offset=".45" stop-color="#0d0c1f" stop-opacity="0"/>
            <stop offset="1" stop-color="#0d0c1f" stop-opacity=".55"/>
          </radialGradient>
          <pattern id="bands" width="44" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(-18 100 100)">
            <rect x="0" width="14" height="200" fill="#fff" fill-opacity=".3"/>
            <rect x="26" width="8" height="200" fill="#2a3f9e" fill-opacity=".28"/>
          </pattern>
          <pattern id="bands2" width="30" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(-18 100 100)">
            <rect x="8" width="5" height="200" fill="#fff" fill-opacity=".2"/>
          </pattern>
          <clipPath id="ball"><circle cx="100" cy="100" r="44"/></clipPath>
        </defs>
        <circle class="star" cx="20" cy="30" r="1.6" fill="#fff" style="animation-delay:-0s"/>
        <circle class="star" cx="58" cy="18" r="1.1" fill="#fff" style="animation-delay:-0.8s"/>
        <circle class="star" cx="105" cy="10" r="1.4" fill="#ffe08a" style="animation-delay:-1.6s"/>
        <circle class="star" cx="190" cy="16" r="1.2" fill="#fff" style="animation-delay:-0.4s"/>
        <circle class="star" cx="240" cy="34" r="1.8" fill="#c4a8ee" style="animation-delay:-1.2s"/>
        <circle class="star" cx="262" cy="78" r="1.1" fill="#fff" style="animation-delay:-2.1s"/>
        <circle class="star" cx="250" cy="130" r="1.5" fill="#fff" style="animation-delay:-0.2s"/>
        <circle class="star" cx="268" cy="176" r="1.2" fill="#ffe08a" style="animation-delay:-1.9s"/>
        <circle class="star" cx="225" cy="202" r="1.4" fill="#fff" style="animation-delay:-0.9s"/>
        <circle class="star" cx="160" cy="212" r="1.1" fill="#c4a8ee" style="animation-delay:-2.4s"/>
        <circle class="star" cx="95" cy="206" r="1.6" fill="#fff" style="animation-delay:-1.4s"/>
        <circle class="star" cx="48" cy="186" r="1.2" fill="#fff" style="animation-delay:-0.6s"/>
        <circle class="star" cx="14" cy="140" r="1.4" fill="#ffe08a" style="animation-delay:-2.2s"/>
        <circle class="star" cx="26" cy="94" r="1.1" fill="#fff" style="animation-delay:-1.0s"/>
        <circle class="star" cx="78" cy="56" r="0.9" fill="#fff" style="animation-delay:-1.7s"/>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script>
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("send-btn");
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
const historyEl = document.getElementById("history");
const STORE = "lala-chats-v1";
const NEW_TITLE = "New chat";
const isTouch = window.matchMedia("(pointer: coarse)").matches;
let busy = false;
let chats = [];      // saved conversations, newest first
let current = null;  // the conversation on screen

function getCsrf() {
  const m = document.cookie.match(/(?:^|; )csrftoken=([^;]*)/);
  if (m) return decodeURIComponent(m[1]);
  const el = document.querySelector("[name=csrfmiddlewaretoken]");
  return el ? el.value : "";
}

/* ---------- Saved history (stored in this browser) ---------- */
function loadChats() {
  try {
    const list = JSON.parse(localStorage.getItem(STORE) || "[]");
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}
function saveChats() {
  try { localStorage.setItem(STORE, JSON.stringify(chats.slice(0, 30))); } catch (e) {}
}

/* ---------- Markdown + math rendering ---------- */
if (window.DOMPurify) {
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") {
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });
}

function mathToHtml(tex, display) {
  try {
    return katex.renderToString(tex, { displayMode: display, throwOnError: false });
  } catch (e) {
    return "";
  }
}

function renderMarkdown(text) {
  const store = [];
  const keep = (tex, display) => {
    store.push(mathToHtml(tex.trim(), display));
    return "@@MATH" + (store.length - 1) + "@@";
  };

  let t = text;
  if (window.katex) {
    t = t
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => keep(m, true))
      .replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => keep(m, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => keep(m, false))
      .replace(/\$([^\s$][^$\n]*?[^\s$]|[^\s$])\$/g, (_, m) => keep(m, false));
  }

  let html = marked.parse(t, { breaks: true });
  html = DOMPurify.sanitize(html);
  return html.replace(/@@MATH(\d+)@@/g, (_, i) => store[Number(i)] || "");
}

function setReply(el, text) {
  if (window.marked && window.DOMPurify) {
    el.classList.add("md");
    el.innerHTML = renderMarkdown(text);
  } else {
    el.textContent = text;   // libraries not loaded: show plain text
  }
}

/* ---------- Chat ---------- */
function showHero() {
  chat.appendChild(document.getElementById("hero-tpl").content.cloneNode(true));
}

// Adds a name label + bubble; returns the bubble
function addMessage(text, who) {
  const hero = chat.querySelector(".empty");
  if (hero) hero.remove();

  const row = document.createElement("div");
  row.className = "row " + who;
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = who === "ai" ? "Lala" : "You";
  const bubble = document.createElement("div");
  bubble.className = "message " + who;
  bubble.textContent = text;
  row.append(name, bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function render() {
  chat.innerHTML = "";
  if (!current.msgs.length) {
    showHero();   // planet + greeting on an empty chat
  } else {
    current.msgs.forEach((m) => {
      const bubble = addMessage(m.text, m.who);
      if (m.who === "ai") setReply(bubble, m.text);
    });
  }
  chat.scrollTop = chat.scrollHeight;
  renderHistory();
}

function newChat() {
  current = { id: Date.now().toString(36), title: NEW_TITLE, msgs: [] };
  render();
  closeDrawer();
  if (!isTouch) promptBox.focus();
}

async function sendPrompt(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true;
  const convo = current;

  addMessage(text, "user");
  convo.msgs.push({ who: "user", text });
  if (convo.title === NEW_TITLE) convo.title = text.slice(0, 40);
  if (!chats.includes(convo)) chats.unshift(convo);
  saveChats();
  renderHistory();
  promptBox.value = "";

  const loading = addMessage("Thinking...", "ai");
  try {
    const res = await fetch("/ask/", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": getCsrf() },
      credentials: "same-origin",
      body: JSON.stringify({ prompt: text }),
    });
    const raw = await res.text();
    let data = {};
    try { data = JSON.parse(raw); } catch (e) {}
    if (res.ok && data.reply) {
      setReply(loading, data.reply);
      convo.msgs.push({ who: "ai", text: data.reply });
      chats = [convo, ...chats.filter((c) => c !== convo)];  // move to top
      saveChats();
      renderHistory();
    } else {
      loading.textContent = data.error || ("Server error " + res.status + ". Please refresh the page and try again.");
    }
  } catch (err) {
    loading.textContent = "Could not reach the server. Check your connection.";
  }
  busy = false;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener("click", () => sendPrompt(promptBox.value));

promptBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !isTouch) {
    e.preventDefault();
    sendPrompt(promptBox.value);
  }
});

document.getElementById("new-btn").addEventListener("click", newChat);
document.getElementById("new-chat").addEventListener("click", newChat);

document.querySelectorAll(".chip").forEach((btn) => {
  btn.addEventListener("click", () => sendPrompt(btn.textContent));
});

/* ---------- Menu + history drawer ---------- */
function openDrawer() {
  renderHistory();
  drawer.classList.add("open");
  overlay.classList.add("open");
  document.getElementById("close-drawer").focus();
}
function closeDrawer() {
  drawer.classList.remove("open");
  overlay.classList.remove("open");
}

function renderHistory() {
  historyEl.innerHTML = "";
  if (!chats.length) {
    const empty = document.createElement("div");
    empty.className = "hist-empty";
    empty.textContent = "No chats yet.";
    historyEl.appendChild(empty);
    return;
  }
  chats.forEach((c) => {
    const item = document.createElement("div");
    item.className = "hist-item" + (c === current ? " active" : "");

    const open = document.createElement("button");
    open.className = "hist-open";
    open.textContent = c.title;
    open.addEventListener("click", () => {
      current = c;
      render();
      closeDrawer();
    });

    const del = document.createElement("button");
    del.className = "hist-del";
    del.textContent = "×";
    del.setAttribute("aria-label", "Delete chat");
    del.addEventListener("click", () => {
      if (!confirm("Delete this chat?")) return;
      chats = chats.filter((x) => x !== c);
      saveChats();
      if (c === current) newChat(); else renderHistory();
    });

    item.append(open, del);
    historyEl.appendChild(item);
  });
}

document.getElementById("menu-btn").addEventListener("click", openDrawer);
document.getElementById("close-drawer").addEventListener("click", closeDrawer);
overlay.addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

/* ---------- Start ---------- */
chats = loadChats();
current = { id: Date.now().toString(36), title: NEW_TITLE, msgs: [] };
render();

/* ---------- Offline detection ---------- */
function updateStatus() {
  document.getElementById("offline-banner")
    .classList.toggle("d-none", navigator.onLine);
}
window.addEventListener("online", updateStatus);
window.addEventListener("offline", updateStatus);
updateStatus();

/* ---------- Service worker ---------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}

/* ---------- Install button ---------- */
let deferredPrompt = null;
const installBtn = document.getElementById("install-btn");
if (installBtn) {
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.remove("d-none");
  });
  installBtn.addEventListener("click", async () => {
    installBtn.classList.add("d-none");
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    }
  });
  window.addEventListener("appinstalled", () => installBtn.classList.add("d-none"));
}
</script>

</body>
</html>
